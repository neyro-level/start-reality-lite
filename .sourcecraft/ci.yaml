# Start Reality Lite — COMMERCIAL SourceCraft CI.
# Push never runs validation (empty paths sentinel).
# Pull requests run a light check. merge-gate is the manual exact-head gate.

on:
  pull_request:
    - workflows: [pr-light]
  push:
    - workflows: [merge-gate]
      filter:
        paths: []

workflows:
  pr-light:
    settings:
      max_cube_duration: 20m
    tasks:
      - name: lint-and-layers
        checkout:
          fetch_depth: 1
        cubes:
          - name: lint-layers
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - |
                set -eu
                if grep -E 'DATABASE_URL|payload|prisma|postgres' package.json pnpm-lock.yaml >/dev/null 2>&1; then
                  echo "Database/CMS stack must not appear in REALTY_LITE dependencies."
                  exit 1
                fi
                corepack enable
                corepack prepare pnpm@12.8.1 --activate
                pnpm install --frozen-lockfile --reporter=append-only
                pnpm lint
                pnpm verify:layers

  merge-gate:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Full 40-character PR head SHA reviewed for merge"
    settings:
      max_cube_duration: 45m
    tasks:
      - name: exact-head-merge-gate
        checkout:
          fetch_depth: 1
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        cubes:
          - name: verify-and-build
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - |
                set -eu
                actual_sha="$(git rev-parse HEAD)"
                if [ "$actual_sha" != "$EXPECTED_COMMIT_SHA" ]; then
                  echo "Exact-head mismatch: actual=$actual_sha expected=$EXPECTED_COMMIT_SHA"
                  exit 1
                fi
                echo "Exact-head verified: $actual_sha"
                if grep -E 'DATABASE_URL|payload|prisma|postgres' package.json pnpm-lock.yaml >/dev/null 2>&1; then
                  echo "Database/CMS stack must not appear in REALTY_LITE dependencies."
                  exit 1
                fi
                corepack enable
                corepack prepare pnpm@12.8.1 --activate
                pnpm install --frozen-lockfile --reporter=append-only
                pnpm verify
                pnpm build
